<svg xmlns="http://www.w3.org/2000/svg" width="512" height="192" class="svgbob"><style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
    stroke: black;
    stroke-width: 2;
    stroke-opacity: 1;
    fill-opacity: 1;
    stroke-linecap: round;
    stroke-linejoin: miter;
}
.svgbob text {
    white-space: pre;
    fill: black;
    font-family: Iosevka Fixed, monospace;
    font-size: 14px;
}
.svgbob rect.backdrop {
    stroke: none;
    fill: white;
}
.svgbob .broken {
    stroke-dasharray: 8;
}
.svgbob .filled {
    fill: black;
}
.svgbob .bg_filled {
    fill: white;
    stroke-width: 1;
}
.svgbob .nofill {
    fill: white;
}
.svgbob .end_marked_arrow {
    marker-end: url(#arrow);
}
.svgbob .start_marked_arrow {
    marker-start: url(#arrow);
}
.svgbob .end_marked_diamond {
    marker-end: url(#diamond);
}
.svgbob .start_marked_diamond {
    marker-start: url(#diamond);
}
.svgbob .end_marked_circle {
    marker-end: url(#circle);
}
.svgbob .start_marked_circle {
    marker-start: url(#circle);
}
.svgbob .end_marked_open_circle {
    marker-end: url(#open_circle);
}
.svgbob .start_marked_open_circle {
    marker-start: url(#open_circle);
}
.svgbob .end_marked_big_open_circle {
    marker-end: url(#big_open_circle);
}
.svgbob .start_marked_big_open_circle {
    marker-start: url(#big_open_circle);
}<!--separator--></style><defs><marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 0,4 4,2 0,0"></polygon></marker><marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,2 2,0 4,2 2,4 0,2"></polygon></marker><marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="filled"></circle></marker><marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="bg_filled"></circle></marker><marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="3" class="bg_filled"></circle></marker></defs><rect class="backdrop" x="0" y="0" width="512" height="192"></rect><text x="2" y="12" >$$$$$$$</text><line x1="56" y1="0" x2="72" y2="32" class="solid"></line><text x="162" y="12" >$$</text><line x1="176" y1="0" x2="184" y2="16" class="solid"></line><text x="210" y="12" >$$</text><line x1="224" y1="0" x2="232" y2="16" class="solid"></line><text x="242" y="12" >$$</text><line x1="256" y1="0" x2="288" y2="64" class="solid"></line><text x="266" y="60" >$$</text><text x="314" y="12" >$$</text><line x1="328" y1="0" x2="336" y2="16" class="solid"></line><text x="346" y="12" >$$</text><line x1="360" y1="0" x2="368" y2="16" class="solid"></line><text x="426" y="12" >$$$$$$$</text><line x1="480" y1="0" x2="496" y2="32" class="solid"></line><text x="2" y="28" >$$</text><text x="50" y="28" >$$</text><text x="162" y="28" >$$</text><text x="186" y="28" >|</text><text x="210" y="28" >$$</text><text x="234" y="28" >|$$$</text><text x="306" y="28" >$$$</text><text x="338" y="28" >|$$</text><text x="370" y="28" >|</text><text x="426" y="28" >$$</text><text x="4